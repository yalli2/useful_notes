<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>노트 위브 — Note Weave</title>
<meta name="description" content="흩어진 메모를 엮어 쓸모 있는 지식으로. 제텔카스텐과 스케치노트를 함께 실습하고 모두의 결과를 실시간으로 확인하는 HR 성인 학습 프로그램.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23FFC928'/%3E%3Cpath d='M18 42L30 20L48 34L40 50zM30 20L40 50' fill='none' stroke='%2316202E' stroke-width='3' stroke-linejoin='round'/%3E%3Ccircle cx='18' cy='42' r='6' fill='%23fff' stroke='%2316202E' stroke-width='3'/%3E%3Ccircle cx='30' cy='20' r='6' fill='%23fff' stroke='%2316202E' stroke-width='3'/%3E%3Ccircle cx='48' cy='34' r='6' fill='%23fff' stroke='%2316202E' stroke-width='3'/%3E%3Ccircle cx='40' cy='50' r='6' fill='%23fff' stroke='%2316202E' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip" href="#app">본문으로 건너뛰기</a>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6"/>
    </filter>
  </defs>
</svg>

<header class="topbar">
  <button id="menuBtn" class="icon-btn menu" type="button" aria-label="챕터 목록 열기" aria-expanded="false" aria-controls="chapnav">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <a class="brand" href="#/">
    <svg viewBox="0 0 64 64" width="30" height="30" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#FFC928"/><path d="M18 42L30 20L48 34L40 50zM30 20L40 50" fill="none" stroke="#16202E" stroke-width="3" stroke-linejoin="round"/><circle cx="18" cy="42" r="6" fill="#fff" stroke="#16202E" stroke-width="3"/><circle cx="30" cy="20" r="6" fill="#fff" stroke="#16202E" stroke-width="3"/><circle cx="48" cy="34" r="6" fill="#fff" stroke="#16202E" stroke-width="3"/><circle cx="40" cy="50" r="6" fill="#fff" stroke="#16202E" stroke-width="3"/></svg>
    <span class="brand-t">노트 위브</span><span class="brand-en">Note Weave</span>
  </a>
  <div class="top-right">
    <span id="status" class="status" role="status"></span>
    <button id="roomBtn" class="room-btn" type="button" aria-label="이름과 방 코드 바꾸기"></button>
  </div>
</header>

<div class="shell">
  <nav id="chapnav" class="chapnav" aria-label="챕터"></nav>
  <main id="app" tabindex="-1"></main>
</div>

<footer class="foot">
  <p>노트 위브 · 교재: Edmund Gröpl, 「Make Useful Notes」(2023)를 바탕으로 학습용으로 새로 구성한 자료입니다. 교재 원문과 삽화의 저작권은 저자에게 있습니다.</p>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<dialog id="join" aria-labelledby="join-t">
  <form id="join-form" method="dialog">
    <h2 id="join-t">함께 시작해요</h2>
    <p class="dlg-p">결과에 표시될 이름과, 같은 수업에 모일 방 코드를 정해 주세요.</p>
    <label class="dlg-l" for="jn-name">이름(별칭)</label>
    <input id="jn-name" type="text" maxlength="12" required placeholder="예) 지수" autocomplete="nickname">
    <label class="dlg-l" for="jn-room">방 코드</label>
    <input id="jn-room" type="text" maxlength="24" placeholder="예) HR2026" autocomplete="off">
    <p class="dlg-hint">같은 방 코드를 입력한 사람끼리 결과를 공유합니다. 영문·숫자·한글만 쓸 수 있어요.</p>
    <div class="dlg-actions"><button type="button" id="join-cancel" class="btn ghost">나중에</button><button type="submit" class="btn primary">들어가기</button></div>
  </form>
</dialog>

<dialog id="zoom" class="zoom" aria-label="크게 보기">
  <div class="zoom-body"></div>
  <div class="zoom-bar"><span class="zoom-cap"></span><button type="button" class="btn sm zoom-dl">PNG로 저장</button><button type="button" class="btn ghost sm zoom-close">닫기</button></div>
</dialog>

<script src="config.js"></script>
<script src="js/store.js"></script>
<script src="js/core.js"></script>
<script src="js/render.js"></script>
<script src="js/inputs.js"></script>
<script src="js/views.js"></script>
<script src="js/diagrams.js"></script>
<script src="js/content.js"></script>
<script src="js/app.js"></script>
</body>
</html>
